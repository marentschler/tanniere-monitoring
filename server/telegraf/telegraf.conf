[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["victron/vedirect/+"]
  qos = 1
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "victron_vedirect"
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "serial_number"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_voltage_v"
      type = "float"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_current_a"
      type = "float"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "panel_voltage_v"
      type = "float"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "panel_power_w"
      type = "int"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "load_current_a"
      type = "float"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "yield_today_kwh"
      type = "float"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "yield_yesterday_kwh"
      type = "float"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "max_power_today_w"
      type = "int"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "max_power_yesterday_w"
      type = "int"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "charger_state"
      type = "int"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "error_code"
      type = "int"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "relay_state"
      type = "int"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mppt_state"
      type = "string"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "firmware_version"
      type = "string"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "product_id"
      type = "string"
      optional = true

[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"