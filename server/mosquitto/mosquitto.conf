persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Applies to every listener below. Users are managed with scripts/mqtt-user.sh.
allow_anonymous false
password_file /mosquitto/config/passwd

# Internal plaintext listener. Not published by docker-compose, so it is only
# reachable by Telegraf on the compose network.
listener 1883
protocol mqtt

# Public listener for remote client bridges. The certificate is the one Caddy
# obtains for $DOMAIN, copied here by scripts/sync-mqtt-certs.sh. Mosquitto
# refuses to start while those files are missing -- that is intentional, it
# keeps 8883 from ever serving plaintext.
listener 8883
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
